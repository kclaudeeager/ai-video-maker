# Copy to config.yaml and adjust. Secrets go in .env, never here.
paths:
  workspace_dir: ./workspace
  models_dir: ~/.cache/ai-video-maker/models
  music_dir: ./assets/music
  sfx_dir: ./assets/sfx

# The music bed, when assets/music/ has anything in it. With an empty library the
# render is narration only and these are never read. See docs/audio-design.md.
audio:
  # How loud the bed sits under the narration, in dB.
  music_volume_db: -18
  # How far it drops while someone is talking, in dB. 0 turns the ducking off.
  duck_amount_db: 12
  # Sound effects, from assets/sfx/. Off means no whooshes and no accents at all;
  # how loud they sit when on is the template's sfx_profile. With an empty
  # assets/sfx/ these change nothing either way.
  sfx_enabled: true
  # Just the whooshes on scene cuts, leaving the beat accents in place.
  transition_sfx_enabled: true

# Stock search. See docs/visual-search-design.md.
visuals:
  # Score the candidate thumbnails with Gemini Flash when the metadata ranking has
  # not actually decided the scene — the top two within a third of a point, or a
  # field that matched under half the query. Off by default: it spends the same
  # 240-requests-a-day Gemini budget the script stage falls back on, and only the
  # ambiguous scenes of a run are worth that. Needs GEMINI_API_KEY.
  rerank_enabled: false

# The final encode.
render:
  # Encode with the machine's hardware H.264 encoder (QSV, then VA-API, then
  # VideoToolbox) instead of libx264. `videomaker run --fast` turns it on for one
  # run; this turns it on for every run. Off by default, because it is a trade
  # rather than a free win: measured here on a 116 s 1080p cut, h264_vaapi halved
  # the segment encode (37 s -> 19 s) and cut the whole run's CPU time roughly
  # fourfold, for a slightly softer picture (SSIM 0.9934 against libx264's 0.9952)
  # and a fifth more bytes. Changing it re-encodes every project's build/ and
  # output/ once, and again if you change it back. `videomaker doctor` says
  # whether this machine has an encoder that will actually open.
  fast_mode: false
