# Copy to config.yaml and adjust. Secrets go in .env, never here.
paths:
  workspace_dir: ./workspace
  models_dir: ~/.cache/ai-video-maker/models
  music_dir: ./assets/music
  sfx_dir: ./assets/sfx

# The music bed, when assets/music/ has anything in it. With an empty library the
# render is narration only and these are never read. See docs/audio-design.md.
audio:
  # How loud the bed sits under the narration, in dB.
  music_volume_db: -18
  # How far it drops while someone is talking, in dB. 0 turns the ducking off.
  duck_amount_db: 12
  # Sound effects, from assets/sfx/. Off means no whooshes and no accents at all;
  # how loud they sit when on is the template's sfx_profile. With an empty
  # assets/sfx/ these change nothing either way.
  sfx_enabled: true
  # Just the whooshes on scene cuts, leaving the beat accents in place.
  transition_sfx_enabled: true

# Stock search. See docs/visual-search-design.md.
visuals:
  # Score the candidate thumbnails with Gemini Flash when the metadata ranking has
  # not actually decided the scene — the top two within a third of a point, or a
  # field that matched under half the query. Off by default: it spends the same
  # 240-requests-a-day Gemini budget the script stage falls back on, and only the
  # ambiguous scenes of a run are worth that. Needs GEMINI_API_KEY.
  rerank_enabled: false

# The final encode.
render:
  # Encode with the machine's hardware H.264 encoder (QSV, then VA-API, then
  # VideoToolbox) instead of libx264. `videomaker run --fast` turns it on for one
  # run; this turns it on for every run. Off by default, because it is a trade
  # rather than a free win: measured here on a 116 s 1080p cut, h264_vaapi halved
  # the segment encode (37 s -> 19 s) and cut the whole run's CPU time roughly
  # fourfold, for a slightly softer picture (SSIM 0.9934 against libx264's 0.9952)
  # and a fifth more bytes. Changing it re-encodes every project's build/ and
  # output/ once, and again if you change it back. `videomaker doctor` says
  # whether this machine has an encoder that will actually open.
  fast_mode: false

# Voice vendors reached over HTTP, for languages the local Kokoro voice cannot
# speak (Kinyarwanda, for one: espeak-ng, which Kokoro phonemises through, has
# no voice for it). A vendor is described here and nowhere else — no vendor name
# appears in the code. Anything listed becomes selectable by name under
# `providers: tts:` above. See docs/voice-providers.md.
#
# **A metered vendor spends real money.** The budget guard refuses a run past
# 30 minutes or $1.00 unless you confirm it (`--yes`, or the confirm button
# that shows the estimate); a whole Bible is ~5,270 minutes, ~$527 at $0.10/min.
#
# voice_providers:
#   - name: vendor                      # the name to use under providers: tts:
#     endpoint: https://api.vendor.example/v1/tts
#     api_key_env: VOICE_API_KEY        # the .env variable holding the key
#     auth_header: Authorization
#     auth_format: "Bearer {key}"
#     text_field: text                  # the JSON field names the vendor expects
#     voice_field: voice
#     language_field: language
#     speed_field: ""                   # "" when the vendor takes no speed
#     extra_body: {format: mp3}         # anything else the vendor wants, verbatim
#     audio_response: raw               # or base64_json, with audio_json_path
#     audio_json_path: ""               # e.g. data.audio when base64_json
#     voices: [nyira, mugabo]
#     languages: [rw, sw]               # ISO 639-1; decides which works can Listen
#     cost_per_minute_usd: 0.10
#     timeout_s: 60
#     requests_per_minute: 60           # 0 = no stated limit, no throttle
#     requests_per_day: 1000
#     max_concurrency: 1
#     retry_attempts: 4
#     retry_base_delay_s: 1.0

# Where `videomaker music fetch` looks for licence-clear music. Commented out
# because the built-in default (Openverse — aggregates Freesound, Jamendo,
# ccMixter and Wikimedia, no API key) is what a fresh clone should use. Configure
# this only to add or replace a catalogue.
#
# **The project ships no audio and this does not change that**: fetched tracks
# land in your own assets/music/<mood>/, which .gitignore excludes. Only CC0,
# Public Domain Mark, CC BY and CC BY-SA are accepted — NonCommercial forbids the
# monetised use this tool is for, and NoDerivatives does not cover a bed mixed
# under narration. See docs/audio-design.md.
#
# music_sources:
#   - name: openverse
#     endpoint: https://api.openverse.org/v1/audio/
#     query_param: q
#     params: {license: "cc0,pdm,by,by-sa"}
#     page_size_param: page_size
#     results_path: results
#     title_path: title
#     artist_path: creator
#     licence_path: license
#     licence_url_path: license_url
#     attribution_path: attribution
#     source_url_path: foreign_landing_url
#     download_path: url
#     filetype_path: filetype
#     duration_path: duration
#     timeout_s: 30

