# Render blueprint. `render.yaml` in the repo root is what Render reads when you
# create a Blueprint from this repository — see docs/deploying.md.
#
# **This file describes the free deployment: a reading server, and nothing else.**
# It is the cheap way to put a library in front of people, and every line below
# that looks like a limitation is one. What it can do: serve the text, the briefs,
# the shelf, the feed and the zip. What it cannot: narrate, align or render, and
# it keeps nothing across a restart.
#
# Three facts decide the whole shape, and none of them are ours:
#
# **Free is 512 MB and 0.1 CPU.** Kokoro's ONNX model is 311 MB resident and
# faster-whisper base another 142 MB, so voicing runs out of memory before it
# finishes a chapter; a two-minute video took ~70 s of libx264 on a full desktop
# core, so a tenth of one turns a render into a quarter of an hour. `ML: "0"`
# therefore builds the image without them at all — 980 MB against 2.56 GB,
# measured — and narration is then absent rather than broken.
#
# **Free has no persistent disk.** The filesystem is wiped on every deploy *and*
# every spin-down, so an imported work has to be imported again after each cold
# start. Nothing here is somewhere to keep anything.
#
# **A studio on a public URL is a studio anyone can spend your quota on.**
# `AUDIENCE: reader` mounts no route that can create, run or render, so this is a
# deployment choice rather than a permission system: `/projects/...` is a 404
# because there is no such route.
#
# To run the real thing — voices, renders, and projects that survive a deploy —
# `plan: standard`, `ML: "1"`, drop `AUDIENCE`, and put back:
#
#     disk:
#       name: longhand-workspace
#       mountPath: /data
#       sizeGB: 10
#
# 10 GB is about five finished projects at the ~390 MB M3 measured. Without that
# block, `WORKSPACE_DIR` below points at ephemeral storage — which is exactly what
# free gives you, and why it is fine to leave it pointing there.

services:
  - type: web
    name: longhand
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # 512 MB / 0.1 CPU — read the header before raising this
    region: frankfurt # nearest to Rwanda of Render's regions; change if you move
    healthCheckPath: /healthz
    # One instance, always. The worker is a single in-process thread holding a
    # `flock` per project, and a disk cannot be attached to more than one instance
    # anyway. Scaling this out needs a real job queue first.
    numInstances: 1

    envVars:
      # Generated once by Render and never shown in the repo. Read it from the
      # dashboard (Environment → LONGHAND_PASSWORD) and log in as user `longhand`.
      # Without it the container refuses to start rather than serving open.
      - key: LONGHAND_PASSWORD
        generateValue: true

      # `sync: false` means "ask me for this in the dashboard, do not read it
      # from the repo". These are live billing credentials.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false

      # Matches the Dockerfile. On free this is ephemeral storage and the
      # library is empty after every spin-down; with a disk mounted at /data it
      # is where everything is kept. Restated here so it is visible in the
      # dashboard next to the thing it depends on.
      - key: WORKSPACE_DIR
        value: /data/workspace

      # No route that can create, run or render — see the header.
      - key: AUDIENCE
        value: reader

      # Render terminates TLS at its edge and forwards plain HTTP to the
      # container, saying so in `X-Forwarded-Proto`. Uvicorn ignores that header
      # unless the peer is in `forwarded_allow_ips`, which defaults to
      # `127.0.0.1` — and Render's proxy is not loopback. Left alone, every URL
      # the app builds from the request comes out `http://` on an `https://`
      # site: measured against a server behind a proxy claiming https, the feed
      # address rendered `http://longhand.onrender.com/library/web/feed.xml`
      # with the default and `https://...` with this set. That address is copied
      # into podcast players and stamped into every enclosure in the feed, where
      # a redirect is at best noise and at worst a client that refuses it.
      #
      # `*` trusts the forwarding headers from any peer, which is safe here only
      # because nothing but Render's proxy can reach the container: it has no
      # public port of its own. Do not carry this into a deployment where the
      # container is directly reachable.
      - key: FORWARDED_ALLOW_IPS
        value: "*"

      # Render turns a service's environment variables into Docker build
      # arguments, which is how this reaches the Dockerfile. `0` drops the model
      # stack a 512 MB box cannot run anyway: 980 MB of image against 2.56 GB.
      # It also removes narration, and a work with no narration has no podcast
      # feed — the trade the header describes.
      - key: ML
        value: "0"
