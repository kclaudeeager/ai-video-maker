name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install (no ml extra — CI never runs model inference)
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -q
